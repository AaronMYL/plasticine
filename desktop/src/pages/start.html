<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; font-src 'self'">
<meta name="color-scheme" content="light dark">
<title>Plasticine</title>
<!-- 桌面客户端的开始页（11-08 首次使用流程，设计稿 Welcome / Welcome-Win）：二选一、连到我的 Plasticine、正在打开、
     没起来。令牌照 client/src/tokens.css 的方向 I（暖米 / 暖炭黑），跟随系统深浅色；只用壳自带的静态文件。 -->
<style>
  @font-face { font-family: 'Geist'; src: url('fonts/Geist-Variable.woff2') format('woff2');
    font-weight: 100 900; font-style: normal; font-display: swap; }
  :root { color-scheme: light dark;
    --bg: #fcf9f6; --fg: #2a2622; --fg2: #6b635b; --fg3: #a1988f; --line2: rgba(42, 38, 34, .16);
    --tint2: rgba(110, 74, 46, .075); --accent: #a1674e; --err: #a9483a; --float: #fefdfa;
    --sans: Geist, 'PingFang SC', MiSans, 'Microsoft YaHei', system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2b2826; --fg: #f5f1ec; --fg2: #b8b0a7; --fg3: #8a827a; --line2: rgba(245, 236, 226, .16);
      --tint2: rgba(245, 236, 226, .085); --accent: #c98a6e; --err: #e08a7a; --float: #37332f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans);
    font-size: 14px; line-height: 22px; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  /* 空白处能拖窗口；Mac 交通灯在左上，Windows 的窗口按钮（titleBarOverlay，138 × 32）在右上：内容只在中间，
     上下各留出顶栏那么高，窄窗口也不压着它们。 */
  body { display: flex; align-items: center; justify-content: center; padding: 48px 24px;
    -webkit-app-region: drag; user-select: none; }
  main { -webkit-app-region: no-drag; }
  section { display: flex; flex-direction: column; gap: 20px; width: 400px; max-width: 100%;
    animation: enter 180ms ease-out; }
  section.wide { width: 640px; }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { section { animation: none; } }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--fg3); outline-offset: 2px; }
  svg { flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .mark-blob { fill: var(--accent); }
  .mark-swirl { stroke: var(--bg); }
  h1 { font-size: 26px; line-height: 34px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .meta { font-size: 12px; line-height: 18px; color: var(--fg2); margin: 0; }
  .detail { color: var(--fg2); margin: -10px 0 0; user-select: text; overflow-wrap: anywhere; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line2); padding: 22px; display: flex;
    flex-direction: column; gap: 12px; background: var(--float); text-align: left; min-height: 188px;
    transition: box-shadow 120ms ease-out; }
  .card:hover:not(:disabled), .card.on { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .card:disabled { cursor: default; opacity: .45; }
  .card-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--tint2); display: flex;
    align-items: center; justify-content: center; }
  .card-title { font-size: 16px; line-height: 24px; font-weight: 600; }
  .card-detail { color: var(--fg2); font-size: 13px; line-height: 20px; }
  .tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12px; line-height: 18px; color: var(--fg2); background: var(--tint2); border-radius: 6px;
    padding: 2px 8px; }
  form { display: flex; flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; line-height: 20px; color: var(--fg2); }
  .input { height: 42px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line2); padding: 0 12px;
    display: flex; align-items: center; gap: 8px; background: var(--bg); font-size: 15px;
    transition: box-shadow 120ms ease-out; }
  .input:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .input input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: inherit;
    padding: 0; height: 100%; user-select: text; }
  .input input::placeholder { color: var(--fg3); }
  .input input:focus-visible { outline: 0; }
  .suffix { color: var(--fg3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .error { color: var(--err); font-size: 13px; line-height: 20px; margin: -14px 0 0; }
  .primary { height: 44px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 15px;
    font-weight: 500; display: flex; align-items: center; justify-content: center; width: 100%;
    transition: opacity 120ms ease-out; }
  .primary:disabled { opacity: .35; cursor: default; }
  .link { font-size: 13px; color: var(--fg2); display: inline-flex; align-items: center; gap: 4px;
    align-self: flex-start; }
  .link:hover { color: var(--fg); }
  .progress { height: 2px; border-radius: 1px; background: var(--tint2); overflow: hidden; position: relative; }
  .progress i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--fg2); border-radius: 1px;
    animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .progress i { animation: none; left: 0; width: 100%; opacity: .3; } }
  @media (max-width: 720px) { .choice { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  </div>
</template>
<main>
  <section id="welcome" class="wide" hidden>
    <div data-brand></div>
    <h1>在哪里用 Plasticine？</h1>
    <div class="choice">
      <button type="button" class="card" id="choose-local">
        <span class="card-icon"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5"
          width="13" height="8.5" rx="1.5"></rect><path d="M5.5 14h5M8 11v3"></path></svg></span>
        <span class="card-title">在这台电脑上</span>
        <span class="card-detail">数据只在这台电脑里。</span>
        <span class="tags" id="local-tags"><span>第一次用选这个</span><span id="stops-when">合上盖子就停</span></span>
      </button>
      <button type="button" class="card" id="choose-remote">
        <span class="card-icon"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path
          d="M4.6 12.5a3 3 0 0 1-.4-6 4 4 0 0 1 7.6-1.1 3.4 3.4 0 0 1-.1 7.1z"></path></svg></span>
        <span class="card-title">连到我的 Plasticine</span>
        <span class="card-detail">已经在服务器或另一台电脑上用着。</span>
        <span class="tags"><span>用 @账号和密码</span></span>
      </button>
    </div>
    <p class="meta">以后在 设置 · 系统 里能换。</p>
  </section>

  <section id="remote" hidden>
    <div data-brand></div>
    <h1>连到我的 Plasticine</h1>
    <form id="remote-form" novalidate>
      <div class="field">
        <label for="address">@账号或地址</label>
        <div class="input">
          <input id="address" name="address" placeholder="@你的账号" autocomplete="url" autocapitalize="off"
            spellcheck="false" aria-describedby="address-error">
          <span class="suffix" id="address-host" aria-hidden="true"></span>
        </div>
      </div>
      <p class="error" id="address-error" role="alert" hidden></p>
      <button type="submit" class="primary" id="connect">连上</button>
    </form>
    <button type="button" class="link" data-back><svg width="13" height="13" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path
      d="M10 3.5L5.5 8l4.5 4.5"></path></svg>换一个地方</button>
  </section>

  <section id="starting" hidden>
    <div data-brand></div>
    <h1>正在打开 Plasticine…</h1>
    <p class="detail" id="starting-detail" hidden></p>
    <div class="progress" role="progressbar" aria-label="正在打开"><i></i></div>
  </section>

  <section id="failed" hidden>
    <div data-brand></div>
    <h1 id="failed-title">这台电脑上的 Plasticine 没起来</h1>
    <p class="detail" id="failed-detail"></p>
    <button type="button" class="primary" id="retry">再试一次</button>
    <button type="button" class="link" data-back><svg width="13" height="13" viewBox="0 0 16 16" fill="none"
      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path
      d="M10 3.5L5.5 8l4.5 4.5"></path></svg>换一个地方</button>
  </section>
</main>
<script src="start.js"></script>
</body>
</html>
